version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Asia/Baghdad"
    open-pull-requests-limit: 5
    groups:
      safe-non-major-updates:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: "/expo/superapp-mobile"
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: "Asia/Baghdad"
    open-pull-requests-limit: 5
    groups:
      safe-patch-updates:
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: npm
    directory: "/expo/customer-store-mobile"
    schedule:
      interval: weekly
      day: monday
      time: "06:50"
      timezone: "Asia/Baghdad"
    open-pull-requests-limit: 5
    groups:
      safe-patch-updates:
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
