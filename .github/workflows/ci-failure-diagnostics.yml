name: CI Failure Diagnostics

on:
  workflow_run:
    workflows: ["CI", "Native Android CI", "Security Audit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "رقم تشغيل GitHub Actions الفاشل المراد تشخيصه"
        required: true
        type: string

# هذا المسار تشخيصي فقط: لا يمنح صلاحية محتويات المستودع ولا طلبات السحب ولا النشر.
permissions: {}

concurrency:
  group: ci-failure-diagnostics-${{ github.event.workflow_run.name || 'manual' }}-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    # الفروع التطويرية تملك Checks/PR؛ Issue المستودع مخصّصة لتعطّل الفرع الافتراضي فقط.
    # النجاح مطلوب هنا أيضاً كي نغلق القضية المفتوحة آلياً عند تعافي المسار.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       contains(fromJSON('["success","failure","timed_out","action_required"]'), github.event.workflow_run.conclusion)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: إنشاء تقرير تشخيصي مموّه في Issue
        uses: actions/github-script@v9
        with:
          script: |
            const runId = context.eventName === "workflow_dispatch"
              ? Number(core.getInput("run_id", { required: true }))
              : context.payload.workflow_run.id;

            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed("run_id غير صالح.");
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const clean = (value, limit = 160) => String(value ?? "")
              .replace(/[\r\n\t]/g, " ")
              .replace(/[<>`]/g, "")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, limit) || "غير مسمّى";

            const diagnosticKey = Buffer.from(
              JSON.stringify([run.name, run.head_branch]),
            ).toString("base64url");
            const marker = `<!-- ci-failure-diagnostic:key:${diagnosticKey} -->`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const currentIssue = existing.find((issue) => issue.body?.includes(marker));

            if (run.conclusion === "success") {
              if (!currentIssue) {
                core.info("لا توجد قضية تشخيصية مفتوحة لهذا المسار.");
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: currentIssue.number,
                body: `أُغلقت آلياً بعد نجاح التشغيل ${run.html_url}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: currentIssue.number,
                state: "closed",
                state_reason: "completed",
              });
              return;
            }

            if (!["failure", "timed_out", "action_required"].includes(run.conclusion)) {
              core.info("التشغيل ليس فشلاً قابلاً للتشخيص ولا نجاحاً يغلق قضية.");
              return;
            }

            const { data: jobsPage } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              filter: "latest",
              per_page: 100,
            });

            const failedJobs = jobsPage.jobs
              .filter((job) => job.conclusion && !["success", "skipped", "cancelled"].includes(job.conclusion))
              .map((job) => {
                const failedSteps = (job.steps ?? [])
                  .filter((step) => step.conclusion && !["success", "skipped", "cancelled"].includes(step.conclusion))
                  .map((step) => clean(step.name))
                  .join("، ");
                return {
                  name: clean(job.name),
                  conclusion: clean(job.conclusion, 40),
                  steps: failedSteps || "لا توجد خطوة فاشلة محددة في البيانات الوصفية",
                };
              });

            const rows = failedJobs.length
              ? failedJobs.map((job) => `| ${job.name} | ${job.conclusion} | ${job.steps} |`).join("\n")
              : "| لم تتوفر بيانات الوظائف الفاشلة | راجع رابط التشغيل | — |";

            const body = [
              marker,
              "## تشخيص CI تلقائي وآمن",
              "",
              `حدث فشل في تشغيل **${clean(run.name)}** رقم **${run.id}**. هذا التقرير يعتمد على بيانات GitHub الوصفية فقط؛ لا يجلب سجلات قد تحمل أسراراً، ولا يشغّل كود الفرع الفاشل.`,
              "",
              `- رابط التشغيل: ${run.html_url}`,
              `- الالتزام: ${clean(run.head_sha, 64)}`,
              `- الفرع: ${clean(run.head_branch)}`,
              `- النتيجة: ${clean(run.conclusion, 40)}`,
              "",
              "| الوظيفة | النتيجة | الخطوات غير الناجحة |",
              "| --- | --- | --- |",
              rows,
              "",
              "### حدود السلامة",
              "لا ينشئ هذا المسار فرعاً أو commit أو Pull Request، ولا يدمج، ولا ينشر، ولا يشغّل migrations، ولا يقرأ أو يطبع الأسرار. راجع سبب الفشل ثم نفّذ إصلاحاً منفصلاً مع جميع بوابات CI والمراجعة البشرية.",
            ].join("\n");

            const title = `CI Diagnostic: ${clean(run.name, 90)} (${clean(run.head_branch, 80)})`;
            if (currentIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: currentIssue.number,
                title,
                body,
              });
              core.info(`حُدّثت القضية التشخيصية #${currentIssue.number}.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
