name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# استقرار المشغّلات (٧/٨/٢٦) — تشخيصٌ بالأدلّة: المستودع فيه عشرات الفروع النشطة، وكلّ دفعةٍ
# كانت تُطلق تشغيلاً جديداً **بلا إلغاء سابقه**، فيتراكم الطابور حتى تجلس الوظائف ١٦ دقيقةً
# بصفر خطوات ثم تُلغى (وشوهد تشغيلٌ عالقٌ ١١٨١ دقيقة يحجز مشغّلاً). النتيجة: PR يظهر «أحمر»
# بلا أيّ علّة كود، والدمج يُحظر لأنّ الفحص المطلوب لم يكتمل قط.
#   • على الـPR: الدفعة الجديدة تُلغي تشغيل نفس الـPR القديم (نتيجته صارت بلا معنى أصلاً).
#   • على main: **لا إلغاء أبداً** — كلّ التزامٍ على main يجب أن يبقى له سجلّ فحصٍ مكتمل.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Vitest يشغّل ملفات التكامل تسلسلياً عمداً (fileParallelism:false) لأنّ كل ملف ينظّف
  # قاعدة الاختبار. بعد #626 تجاوزت الحزمة الواحدة ٨٣:٥٤ ولم تكتمل ضمن سقف ٩٠ دقيقة.
  # نقسم *الملفات* عبر مشغّلين، لكلّ واحد MySQL مستقلة؛ يبقى التنفيذ داخل كل قاعدة
  # تسلسلياً، واتحاد الشريحتين هو الحزمة الكاملة بلا تداخل وفق عقد Vitest --shard.
  test-shards:
    name: test-shard-${{ matrix.shard }}-of-2
    runs-on: ubuntu-latest
    # ⏱️ ١٥٠ لا ٩٠ — يُعايَر على **أبطأ** مشغّل لا الوسيط. مسألةٌ مستقلّة عن التجزئة أدناه:
    # تلك تُنقص العمل، وهذه تُحصّن من تفاوت المشغّلات. الدليل من تشغيلات PR #634:
    #   • قبل إصلاح التجزئة: الشريحتان تُنفّذان العمل نفسه بالضبط (٥٤٧ ملفاً لكلٍّ)، فأنهت
    #     الأولى في ٥٢ دقيقة ولم تُنهِ الثانية في ٩٠ ⇒ ١.٧×+ فرقاً على عملٍ متطابق.
    #   • **بعد** إصلاح التجزئة: الشريحة ٢ (~٢٧٥ ملفاً) قُتلت عند ٩٠ **بلا فشل اختبارٍ واحد**
    #     ولا ملفٍّ بزمنٍ شاذّ — كلُّ ملفٍّ أبطأ بمضاعفات (٢٤ اختبار دوالّ نصّية في ١٧ث).
    #   • وفي التشغيلة التالية أنهت الشريحة نفسها في ٢٣ دقيقة ⇒ تفاوتٌ ~٤× بين مشغّلٍ وآخر.
    # وسقفٌ ضيّق لا يكشف بطئاً بل يُحمّر PR سليماً ويُخفي نتيجته — «فشلٌ» لا يدلّ على شيء.
    # لا كلفة على التشغيل السليم: المهلة سقفٌ لا حجز، والوظيفة تنتهي في ~٢٥ دقيقة كالمعتاد.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mysql:
        image: mysql:8.0
        env:
          # خدمة محلية مؤقتة داخل runner معزول؛ لا اعتماد ثابت كي لا يدخل سرٌ تاريخ Git.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/erp_test
      TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/erp_test
      ALLOW_TEST_DB_PORT_3306: "1"
      TEST_CONTROL_DATABASE_URL: mysql://root@127.0.0.1:3306/erp_control_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: توليد سر JWT مؤقت لتشغيل الاختبارات
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: تهيئة مخطّط قاعدة الاختبار
        run: pnpm db:push
      - name: تَطبيق هَجرات يَدوية إضافية (GENERATED columns إلخ)
        run: node scripts/ci-apply-extra-migrations.mjs
      - name: تهيئة قاعدة التحكّم (تعدّد الشركات)
        run: node scripts/bootstrap-control-db.mjs
        env:
          CONTROL_DATABASE_URL: mysql://root@127.0.0.1:3306/erp_control_test
      - name: الاختبارات — الشريحة ${{ matrix.shard }}/2
        # ⚠️ pnpm يبتلع الخيارات **بالصيغتين**: `pnpm test --shard=…` يطبع نسخة pnpm نفسها،
        # و`pnpm run test -- --shard=…` لا يُمرّرها أيضاً (مثبَّت: `pnpm run test -- --version`
        # يشغّل الحزمة كاملةً بدل طباعة النسخة). فكانت **كلتا الشريحتين تشغّلان الحزمة كاملة**
        # (٥٤٧ ملفاً لكلٍّ منهما بدل ~٢٧٤): تجزئةٌ بلا أثر، وكلفة CI مضاعفة، وزمن الجدار كما هو.
        # `pnpm exec` يُمرّر الخيارات فعلاً (`pnpm exec cross-env TZ=UTC vitest --version` ⇒ vitest/3.2.7)،
        # وهي الصيغة الموثَّقة في CLAUDE.md §٣ لتشغيل اختبارٍ واحد.
        run: |
          set -o pipefail
          total="$(git ls-files "*.test.ts" | grep -cE "^(server|client/src|shared)/")"
          pnpm exec cross-env TZ=UTC vitest run --shard=${{ matrix.shard }}/2 2>&1 | tee /tmp/shard.log
          # ⚠️ مخرَج vitest ملوَّن: سطر النتيجة مسبوقٌ برموز ANSI، فمرساةُ "^ *Test Files" لا
          # تطابقه ويَخرج $ran فارغاً فتسقط الوظيفة **رغم خضرة الاختبارات** (وقع فعلاً هنا).
          line="$(grep -aE "Test Files" /tmp/shard.log | tail -1)"
          ran="$(printf "%s" "$line" | grep -oE "[(][0-9]+[)]" | tail -1 | tr -d "()")"
          if [ -z "$ran" ]; then echo "تعذّر استخراج عدد الملفات من مخرَج vitest" >&2; exit 1; fi
          echo "الشريحة ${{ matrix.shard }}/2 شغّلت $ran ملفاً من أصل $total"
          # حارسٌ ضدّ عودة العطل صامتاً: التجزئة الفعّالة تُشغّل ~نصف الملفات؛ تجاوز ٧٠٪ يعني
          # أنّ `--shard` لم يصل vitest. لا نقارن بالإجمالي مباشرةً لأنّ المجموعة المُجمَّعة
          # أقلّ قليلاً من الملفات المتعقَّبة (٥٤٧ مقابل ٥٥٠) فتمرّ المقارنة الصارمة كاذبةً.
          test "$((ran * 10))" -lt "$((total * 7))"

  check-test-build:
    needs: test-shards
    # يبقى اسم الفحص المطلوب ثابتاً، ويصدر فشلاً صريحاً بدل skipped إن فشلت/أُلغيت شريحة.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # الاختبارات أصبحت في وظيفتَي الشطر أعلاه؛ هذه الوظيفة للعقود/الحرّاس/البناء فقط.
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: erp_root_pw
          MYSQL_DATABASE: erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -perp_root_pw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:erp_root_pw@127.0.0.1:3306/erp_test
      TEST_DATABASE_URL: mysql://root:erp_root_pw@127.0.0.1:3306/erp_test
      # حارس تنظيف الاختبارات يرفض 3306 افتراضياً؛ هذا سماح صريح لقاعدة CI المحلية *_test.
      ALLOW_TEST_DB_PORT_3306: "1"
      # قاعدة تحكّم منفصلة على نفس خدمة mysql (تعدّد الشركات — controlSchema.ts خارج
      # drizzle-kit push، تُهيَّأ بخطوة bootstrap-control-db.mjs مستقلّة أدناه).
      TEST_CONTROL_DATABASE_URL: mysql://root:erp_root_pw@127.0.0.1:3306/erp_control_test
      JWT_SECRET: ci_test_secret_change_me_0123456789abcdef
    steps:
      - name: تأكيد نجاح جميع شرائح الاختبار
        run: test '${{ needs.test-shards.result }}' = 'success'
      # fetch-depth: 0 — يلزم لحارس «تصادم ترقيم الهجرات مع origin/main» داخل check:migrations
      # (يقارن `_journal.json` بالجانب الآخر). بعمق ١ لا يوجد مرجع origin/main فيتخطّى الحارس
      # صامتاً — و«حارسٌ لا يُشغَّل آلياً ليس حارساً» (درس CI موثَّق في هذا الملف أدناه).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: نشر بصمات العقود الجذرية للإصدار
        run: |
          release_sha="$(git rev-parse HEAD)"
          helper_sha256="$(sha256sum deploy/systemd/pm2-systemd-start.mjs | cut -d ' ' -f 1)"
          dropin_sha256="$(sha256sum deploy/systemd/pm2-deploy.service.d/20-pidfile-reconcile.conf | cut -d ' ' -f 1)"
          nginx_installer_sha256="$(sha256sum scripts/install-nginx-contract.mjs | cut -d ' ' -f 1)"
          nginx_contract_sha256="$(sha256sum scripts/nginx-contract.mjs | cut -d ' ' -f 1)"
          nginx_verifier_sha256="$(sha256sum scripts/verify-nginx-abuse-controls.mjs | cut -d ' ' -f 1)"
          nginx_manifest_sha256="$(sha256sum deploy/nginx-release-manifest.json | cut -d ' ' -f 1)"
          printf 'RELEASE_SHA=%s\nRELEASE_PM2_HELPER_SHA256=%s\nRELEASE_PM2_DROPIN_SHA256=%s\nRELEASE_NGINX_INSTALLER_SHA256=%s\nRELEASE_NGINX_CONTRACT_SHA256=%s\nRELEASE_NGINX_VERIFIER_SHA256=%s\nRELEASE_NGINX_MANIFEST_SHA256=%s\n' "$release_sha" "$helper_sha256" "$dropin_sha256" "$nginx_installer_sha256" "$nginx_contract_sha256" "$nginx_verifier_sha256" "$nginx_manifest_sha256"
          {
            printf '### Root-owned release contracts\n\n'
            printf -- '- `RELEASE_SHA=%s`\n' "$release_sha"
            printf -- '- `RELEASE_PM2_HELPER_SHA256=%s`\n' "$helper_sha256"
            printf -- '- `RELEASE_PM2_DROPIN_SHA256=%s`\n' "$dropin_sha256"
            printf -- '- `RELEASE_NGINX_INSTALLER_SHA256=%s`\n' "$nginx_installer_sha256"
            printf -- '- `RELEASE_NGINX_CONTRACT_SHA256=%s`\n' "$nginx_contract_sha256"
            printf -- '- `RELEASE_NGINX_VERIFIER_SHA256=%s`\n' "$nginx_verifier_sha256"
            printf -- '- `RELEASE_NGINX_MANIFEST_SHA256=%s`\n' "$nginx_manifest_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: عقد PM2/systemd الحقيقي (daemon قائم + إقلاع نظيف)
        run: |
          sudo /usr/bin/install -o root -g root -m 0755 "$(command -v node)" /usr/bin/node
          sudo "$(command -v npm)" install --global --prefix /usr pm2@7.0.3
          sudo /usr/bin/bash scripts/pm2-systemd-linux.test.sh
      # Dependency vulnerability audit lives in its own workflow now (security.yml, via
      # OSV-Scanner) — it runs on the same push/PR triggers, so coverage is unchanged and
      # the build/test job no longer blocks on a separate, redundant audit step.
      - name: تهيئة مخطّط قاعدة الاختبار
        run: pnpm db:push
      - name: تَطبيق هَجرات يَدوية إضافية (GENERATED columns إلخ)
        run: node scripts/ci-apply-extra-migrations.mjs
      - name: Verify production-critical schema contracts
        run: pnpm db:verify
      - name: تهيئة قاعدة التحكّم (تعدّد الشركات)
        run: node scripts/bootstrap-control-db.mjs
        env:
          CONTROL_DATABASE_URL: mysql://root:erp_root_pw@127.0.0.1:3306/erp_control_test
      - name: فحص الأنواع
        run: pnpm check
      - name: حارس تشخيص فشل CI الآمن
        run: pnpm exec vitest run --config vitest.unit.config.ts scripts/__tests__/ciFailureDiagnosticsWorkflow.test.ts
      - name: حارس عقد إصدار تطبيق Android الأصلي
        run: pnpm check:mobile-release
      - name: حارِس الإيموجي UI
        run: pnpm check:emoji
      - name: حارِس المخطّطات المالية (z.string العارية)
        run: pnpm check:money-schemas
      - name: حارِس الفرع الافتراضي الصامت
        run: pnpm check:branch
      - name: حارِس سجل الهجرات وترقيمها
        run: pnpm check:migrations
      # قاعدةُ الاختبار تُبنى بـdb:push من schema.ts، وملفّاتُ SQL لا تُنفَّذ قطّ قبل الإنتاج
      # (CLAUDE.md §٤-ج) ⇒ اسمُ عمودٍ يخالف ما أنشأته الهجرة يمرّ أخضرَ ويسقط على الإنتاج وحده.
      - name: حارِس انحراف أسماء الأعمدة بين schema.ts والهجرات
        run: pnpm check:schema-drift
      - name: حارِس الإجراءات اليتيمة (DoD)
        run: pnpm check:orphans
      - name: حارِس حدود اليوم المحلية (TZ #٧)
        run: pnpm check:date-boundaries
      - name: حارِس الألوان الخام (ratchet — منع لون مال/حالة جديد يتجاوز التوكنز)
        run: pnpm check:colors
      # كان معرَّفاً في package.json وضمن check:guards لكنّه **غائبٌ عن CI** ⇒ ظلّ يفشل بصمت
      # على main (إنذارٌ كاذب في SmartCustomerInput) حتى شغّله أحدٌ يدوياً. حارسٌ لا يُشغَّل
      # آلياً ليس حارساً. بهذا صار كل أعضاء check:guards مشمولين (authz له وظيفته المستقلّة).
      - name: حارِس حقول المال والهاتف (IntlPhoneInput / MoneyInput)
        run: pnpm check:form-inputs
      - name: حارِس حدود nginx المشتركة خلف PM2 وCloudflare
        run: pnpm check:nginx-abuse
      - name: حارِس صلاحية Docker Compose
        run: pnpm check:compose
      # PR #772 (٢٥/٨): FK اسمٌ ٦٥ حرفاً في storeRecommendationDailyMetrics حاصر CI. حارسٌ آليّ
      # يمنع تكراره — أيّ اسم مُتولَّد من `.references()` inline > ٦٤ يُرفض قبل الدمج.
      - name: حارِس أسماء FK (حدّ ٦٤ حرفاً على MySQL 8.4)
        run: pnpm check:fk-name
      # PR #771 كشف `--sem-warning` (بدلاً من `--sem-warn`) في ٦ مواقع بعناصر تحذير غير مرئية.
      # PR #775 (٢٥/٨): حارسٌ يمنع typos في التوكنز المُوحَّدة، حتى داخل `var(--x, fallback)`.
      - name: حارِس متغيّرات CSS غير المعرَّفة (typos في التوكنز)
        run: pnpm check:css-vars
      # PR #795 (٢٥/٨): حرّاس شريحة UX S1-S3 — يجب استدعاؤها **بالاسم** لا عبر aggregate.
      # ملاحظة Codex الصائبة: `check-test-build` يستدعي كلّ حارس صراحةً، ولا يشغّل `pnpm check:guards`
      # ⇒ حارس مُدرَج فقط في aggregate لا يعمل في CI ويسمح للـPR بتخطّي pre-commit.
      - name: حارِس عقد PageHeader (يمنع h1 خامّ + ← رجوع يدويّ)
        run: pnpm check:page-header
      - name: حارِس variants حالة الفاتورة (يمنع خرائط محلّية منجرفة)
        run: pnpm check:invoice-status-variants
      - name: حارِس اعتماد DataTable (يمنع <table> جديدة في pages)
        run: pnpm check:raw-tables
      - name: حارِس اعتماد printReportDoc (يمنع window.print() جديدة في pages)
        run: pnpm check:window-print
      - name: اختبار مدقّق سلامة البطاقات الرقمية (قراءة فقط)
        run: node scripts/verify-digital-cards-integrity.mjs --selftest
      - name: بناء الإنتاج
        run: pnpm build

  # حارس الصلاحيات (T-12) — **مقارنة قاعدة الدمج (merge-base)**، وظيفةٌ مستقلّة سريعة (node فقط، بلا
  # قاعدة/تثبيت). يمسح شجرة الأساس (origin/<base>) وشجرة الـhead ويفشل فقط على انتهاكٍ **يُدخِله الـPR**
  # (raw-role / بلا بوّابة وحدة قراءةً أو كتابةً / admin على كتابة). انتهاكاتُ main موجودةٌ في الأساس
  # ⇒ لا تُحسَب، فلا يفشل الحارس على انجراف main. يحتاج التاريخ الكامل (fetch-depth: 0) لتجهيز الأساس.
  authz-guard:
    runs-on: ubuntu-latest
    # وظيفةٌ خفيفة (node فقط بلا قاعدة/تثبيت) — دقائق معدودة؛ ١٥ سقفٌ يمسك التعليق لا العمل.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: حارِس الصلاحيات (فرق قاعدة الدمج — raw-role/بلا بوّابة/admin-كتابة مستجدّ)
        run: node scripts/authz-guard-diff.mjs
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
