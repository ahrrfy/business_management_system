name: Recovery Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "client/src/lib/offline/outbox*"
      - "client/src/components/returns/useReturnComposerMutations.ts"
      - "client/src/components/returns/ReturnComposer.recovery.test.tsx"
      - "client/src/lib/persistedFinancialIntent*"
      - "client/src/components/invoice/QuickSalesPaymentDialog*"
      - "client/src/components/invoice/InvoiceDetailDrawer*"
      - "client/src/components/purchases/SupplierPaymentsGovernanceWorkspace*"
      - "client/src/pages/SupplierPaymentsGovernance.tsx"
      - "server/services/storeAdmin/storefrontPushCampaignService.ts"
      - "server/services/__tests__/storefrontMobilePushRetirement.unit.test.ts"
      - "vitest.recovery-safety.config.ts"
      - ".github/workflows/recovery-safety.yml"
  push:
    branches: [main]
    paths:
      - "client/src/lib/offline/outbox*"
      - "client/src/components/returns/useReturnComposerMutations.ts"
      - "client/src/components/returns/ReturnComposer.recovery.test.tsx"
      - "client/src/lib/persistedFinancialIntent*"
      - "client/src/components/invoice/QuickSalesPaymentDialog*"
      - "client/src/components/invoice/InvoiceDetailDrawer*"
      - "client/src/components/purchases/SupplierPaymentsGovernanceWorkspace*"
      - "client/src/pages/SupplierPaymentsGovernance.tsx"
      - "server/services/storeAdmin/storefrontPushCampaignService.ts"
      - "server/services/__tests__/storefrontMobilePushRetirement.unit.test.ts"
      - "vitest.recovery-safety.config.ts"
      - ".github/workflows/recovery-safety.yml"

concurrency:
  group: recovery-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  recovery-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Durable payment recovery and atomic offline admission (no database)
        env:
          TZ: UTC
        run: pnpm exec vitest run --config vitest.recovery-safety.config.ts
