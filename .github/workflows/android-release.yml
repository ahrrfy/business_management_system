name: Native Android release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Require successful CI, security, and native gates for current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-release-workflow-gate.mjs
      - name: Verify native release source contract
        run: node scripts/verify-mobile-release-env.mjs
      - name: Verify Expo superapp source
        working-directory: expo/superapp-mobile
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm check
          pnpm test
      - name: Verify Expo customer store source
        working-directory: expo/customer-store-mobile
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm check
          pnpm test

  signed-native-artifacts:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false
      - name: Reconfirm exact-SHA gates before restoring signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-release-workflow-gate.mjs
      - name: Validate release inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_SIGNING_SHA256: ${{ vars.ANDROID_UPLOAD_SIGNING_SHA256 }}
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID || secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          INTEGRATIONS_ENCRYPTION_KEY: ${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          INTEGRATIONS_ENCRYPTION_KEY_SHA256: ${{ vars.INTEGRATIONS_ENCRYPTION_KEY_SHA256 }}
          TWO_FACTOR_ENFORCEMENT: ${{ vars.TWO_FACTOR_ENFORCEMENT }}
          SUPER_APP_NATIVE_REQUIRED: ${{ vars.SUPER_APP_NATIVE_REQUIRED }}
          NATIVE_PUSH_ENVIRONMENT: ${{ vars.NATIVE_PUSH_ENVIRONMENT }}
          HR_DEVICE_BRIDGE: ${{ vars.HR_DEVICE_BRIDGE }}
          HR_DEVICE_PORT: ${{ vars.HR_DEVICE_PORT }}
          HR_DEVICE_IP_ALLOWLIST: ${{ vars.HR_DEVICE_IP_ALLOWLIST }}
          HR_DEVICE_SHARED_SECRET: ${{ secrets.HR_DEVICE_SHARED_SECRET }}
          HR_DEVICE_IDENTITY_BINDINGS: ${{ secrets.HR_DEVICE_IDENTITY_BINDINGS }}
          HR_DEVICE_LEGACY_IDENTITY_MIGRATION: ${{ vars.HR_DEVICE_LEGACY_IDENTITY_MIGRATION }}
          ALRUEYA_PROD_BASE_URL: ${{ vars.ALRUEYA_PROD_BASE_URL }}
          STOREFRONT_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.STOREFRONT_ANDROID_SHA256_CERT_FINGERPRINTS }}
          STOREFRONT_ANDROID_PACKAGE: online.alarabiya.customerstore
        run: node scripts/verify-mobile-release-env.mjs --release
      - name: Verify SuperApp mobile release build
        working-directory: expo/superapp-mobile
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm check:app-config
          pnpm check
          pnpm test
          pnpm exec expo export --platform web
      - name: Verify Customer Store mobile release build
        working-directory: expo/customer-store-mobile
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm check:android-release
          pnpm test:android-release
          pnpm check
          pnpm test
      - name: Reconfirm exact-SHA gates before completing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-release-workflow-gate.mjs
