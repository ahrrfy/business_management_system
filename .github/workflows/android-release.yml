name: Native Android release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require successful CI, security, and native gates for current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-release-workflow-gate.mjs
      - name: Verify native release source contract
        run: node scripts/verify-mobile-release-env.mjs
      - name: Recheck native Android source
        working-directory: android-native
        env:
          ALRUEYA_DEV_BASE_URL: http://10.0.2.2:3000
          ALRUEYA_PROD_BASE_URL: https://srv1548487.hstgr.cloud
          REMOTE_PUSH_CONFIGURED: "false"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testDevDebugUnitTest \
            :app:lintDevDebug \
            :app:lintProdRelease \
            :app:compileDevDebugAndroidTestKotlin \
            :app:assembleDevDebug

  signed-native-artifacts:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reconfirm exact-SHA gates before restoring signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-release-workflow-gate.mjs
      - name: Validate release inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_SIGNING_SHA256: ${{ vars.ANDROID_UPLOAD_SIGNING_SHA256 }}
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID || secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          INTEGRATIONS_ENCRYPTION_KEY: ${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          INTEGRATIONS_ENCRYPTION_KEY_SHA256: ${{ vars.INTEGRATIONS_ENCRYPTION_KEY_SHA256 }}
          TWO_FACTOR_ENFORCEMENT: ${{ vars.TWO_FACTOR_ENFORCEMENT }}
          SUPER_APP_NATIVE_REQUIRED: ${{ vars.SUPER_APP_NATIVE_REQUIRED }}
          NATIVE_PUSH_ENVIRONMENT: ${{ vars.NATIVE_PUSH_ENVIRONMENT }}
          HR_DEVICE_BRIDGE: ${{ vars.HR_DEVICE_BRIDGE }}
          HR_DEVICE_PORT: ${{ vars.HR_DEVICE_PORT }}
          HR_DEVICE_IP_ALLOWLIST: ${{ vars.HR_DEVICE_IP_ALLOWLIST }}
          HR_DEVICE_SHARED_SECRET: ${{ secrets.HR_DEVICE_SHARED_SECRET }}
          HR_DEVICE_IDENTITY_BINDINGS: ${{ secrets.HR_DEVICE_IDENTITY_BINDINGS }}
          HR_DEVICE_LEGACY_IDENTITY_MIGRATION: ${{ vars.HR_DEVICE_LEGACY_IDENTITY_MIGRATION }}
          ALRUEYA_PROD_BASE_URL: ${{ vars.ALRUEYA_PROD_BASE_URL }}
          # Storefront App Links تعتمد بصمة SHA-256 لمفتاح توقيع «مكتبة العربية» في Play App Signing —
          # يُدفَع للسرّ منذ ٢٦/٨/٢٦ (blocker على release-gate)، هنا نمرّره كـenv للـvalidator.
          STOREFRONT_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.STOREFRONT_ANDROID_SHA256_CERT_FINGERPRINTS }}
          # applicationId لتطبيق العميل — قيمة ثابتة معتمدة (verify-mobile-release-env يتحقّق
          # منها حرفياً). نمرّرها هنا مباشرةً لا كـsecret لأنّها معلَنة في كود الإصدار نفسه.
          STOREFRONT_ANDROID_PACKAGE: online.alarabiya.customerstore
        run: node scripts/verify-mobile-release-env.mjs --release
      - name: Restore signing and Firebase configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-upload.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android-native/app/google-services.json
          keytool -list -keystore "$RUNNER_TEMP/android-upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed production APK and AAB
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REMOTE_PUSH_CONFIGURED: "true"
          ALRUEYA_PROD_BASE_URL: ${{ vars.ALRUEYA_PROD_BASE_URL }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean \
            :app:lintProdRelease \
            :app:bundleProdRelease \
            :app:assembleProdRelease
      - name: Verify package, endpoint, and signature
        env:
          EXPECTED_UPLOAD_SHA256: ${{ vars.ANDROID_UPLOAD_SIGNING_SHA256 }}
        run: |
          apk="android-native/app/build/outputs/apk/prod/release/app-prod-release.apk"
          aab="android-native/app/build/outputs/bundle/prodRelease/app-prod-release.aab"
          test -s "$apk"
          test -s "$aab"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose "$apk"
          # The Play upload certificate is intentionally self-signed. `-strict` returns exit code 4
          # for that valid certificate chain, so verify the JAR signature itself and require the
          # positive verification marker instead of treating the expected trust warning as damage.
          jarsigner -verify -verbose -certs "$aab" > "$RUNNER_TEMP/aab-signature.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"
          "$aapt_path" dump badging "$apk" | grep -Fq "package: name='online.alarabiya.store' versionCode='16' versionName='1.0.3'"
          "$aapt_path" dump badging "$apk" | grep -Fq "uses-feature-not-required: name='android.hardware.screen.portrait'"
          unzip -tqq "$aab"
          unzip -tqq "$apk"
          unzip -Z1 "$aab" > "$RUNNER_TEMP/aab-entries.txt"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          if grep -Ei '\.so$' "$RUNNER_TEMP/aab-entries.txt"; then
            echo "Native library found in signed AAB" >&2
            exit 1
          fi
          if grep -Ei '\.so$' "$RUNNER_TEMP/apk-entries.txt"; then
            echo "Native library found in signed APK" >&2
            exit 1
          fi
          unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/native-classes.dex"
          grep -aFq 'https://srv1548487.hstgr.cloud' "$RUNNER_TEMP/native-classes.dex"
          # R8/resource shrinking may shorten the packaged XML path (for example res/a.xml),
          # so resolve the compiled path from the resource table instead of assuming the source path.
          network_config_path="$("$aapt2_path" dump resources "$apk" | awk '
            $1 == "resource" && $NF == "xml/network_security_config" { found = 1; next }
            found {
              for (field = 1; field < NF; field += 1) {
                if ($field == "(file)") { print $(field + 1); exit }
              }
            }
          ')"
          case "$network_config_path" in
            res/*) ;;
            *) echo "network_security_config packaged path was not found" >&2; exit 1 ;;
          esac
          "$aapt2_path" dump xmltree --file "$network_config_path" "$apk" > "$RUNNER_TEMP/network-security-config.txt"
          grep -Fq "T: 'srv1548487.hstgr.cloud'" "$RUNNER_TEMP/network-security-config.txt"
          grep -Fq 'A: includeSubdomains=false' "$RUNNER_TEMP/network-security-config.txt"
          grep -Fq 'A: expiration="2027-08-01"' "$RUNNER_TEMP/network-security-config.txt"
          pin_count=0
          while IFS= read -r expected_pin; do
            test -n "$expected_pin"
            grep -Fq "T: '$expected_pin'" "$RUNNER_TEMP/network-security-config.txt"
            pin_count=$((pin_count + 1))
          done < <(sed -n 's@.*<pin digest="SHA-256">\([^<]*\)</pin>.*@\1@p' android-native/app/src/main/res/xml/network_security_config.xml)
          test "$pin_count" -eq 2
          actual="$("$apksigner_path" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          aab_actual="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_UPLOAD_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$actual"
          test -n "$aab_actual"
          test "$actual" = "$expected"
          test "$aab_actual" = "$expected"
      - name: Record checksums
        run: |
          sha256sum \
            android-native/app/build/outputs/bundle/prodRelease/app-prod-release.aab \
            android-native/app/build/outputs/apk/prod/release/app-prod-release.apk \
            > native-android-SHA256SUMS.txt
      - name: Reconfirm exact-SHA gates before publishing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-android-release-workflow-gate.mjs
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: super-alarabiya-native-${{ github.sha }}
          path: |
            android-native/app/build/outputs/bundle/prodRelease/app-prod-release.aab
            android-native/app/build/outputs/apk/prod/release/app-prod-release.apk
            android-native/app/build/outputs/mapping/prodRelease/mapping.txt
            native-android-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove restored credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/android-upload.jks"
          rm -f android-native/app/google-services.json
