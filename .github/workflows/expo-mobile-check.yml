name: Expo Mobile Check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "expo/customer-store-mobile/**"
      - ".github/workflows/expo-mobile-check.yml"
  push:
    branches: [main]
    paths:
      - "expo/customer-store-mobile/**"

permissions:
  contents: read

concurrency:
  group: expo-mobile-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expo/customer-store-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ runner.os }}-expo-mobile-pnpm-${{ hashFiles('expo/customer-store-mobile/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-expo-mobile-pnpm-

      # --ignore-workspace: هذا التطبيق يعيش تحت جذر ERP لكنّه ليس عضواً في pnpm-workspace.yaml.
      # بلا العلَم، pnpm سيرفع الحزم إلى الجذر ويحرم tsc من أنواعها.
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify image-size DoS mitigation and upstream status
        run: pnpm check:image-size-security -- --check-upstream

      - name: TypeScript check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint --max-warnings=0
