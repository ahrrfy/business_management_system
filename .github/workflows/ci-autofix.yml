name: CI Auto-Fix

on:
  # لا يعمل تلقائياً على كل فشل؛ يحتاج وسم ci-autofix صريحاً على Pull Request.
  # pull_request_target مستخدم فقط للوصول إلى GITHUB_TOKEN، مع حارس يمنع فروع المستودعات الخارجية.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: "اسم فرع داخل هذا المستودع لتطبيق الإصلاحات عليه"
        required: true
        type: string
      base_ref:
        description: "الفرع المرجعي للمقارنة"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-autofix-${{ github.event.pull_request.number || github.event.inputs.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Apply deterministic CI fixes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.label.name == 'ci-autofix' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.inputs.ref }}
      PR_CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref || github.event.inputs.base_ref || 'main' }}
    steps:
      - name: Guard against protected main branch target
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PR_HEAD_REF}" ] || [ "${PR_HEAD_REF}" = "main" ] || [ "${PR_HEAD_REF}" = "refs/heads/main" ]; then
            echo "::error::لا يُسمح بتشغيل ci-autofix مباشرة على الفرع المحمي main."
            exit 1
          fi

      - name: Checkout the requested same-repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR_CHECKOUT_REF }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Determine changed source files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=1
          git diff --name-only -z "origin/${BASE_REF}...HEAD" -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
            ':!dist/**' ':!node_modules/**' \
            > /tmp/ci-autofix-files.bin
          if [ -s /tmp/ci-autofix-files.bin ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            tr '\0' '\n' < /tmp/ci-autofix-files.bin
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "لا توجد ملفات مصدر قابلة للإصلاح التلقائي."
          fi

      - name: Apply formatting-only fixes
        if: steps.changed.outputs.has_files == 'true'
        run: xargs -0 -r pnpm exec prettier --write -- < /tmp/ci-autofix-files.bin

      - name: Verify the generated patch
        if: steps.changed.outputs.has_files == 'true'
        run: |
          set -euo pipefail
          git diff --check
          pnpm check:emoji
          if git diff --quiet; then
            echo "لم ينتج Prettier أي تغيير."
          else
            echo "تغييرات الإصلاح التلقائي:"
            git diff --stat
          fi

      - name: Commit and push to the Pull Request branch only
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs'
          git commit -m "chore(ci): apply deterministic formatting fixes"
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_PUSH_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
            push origin "HEAD:refs/heads/${PR_HEAD_REF}"
