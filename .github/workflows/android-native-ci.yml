name: Native Android CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-ci.yml"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-ci.yml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: native-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test, lint, and assemble the native app
        working-directory: android-native
        env:
          ALRUEYA_DEV_BASE_URL: http://10.0.2.2:3000
          ALRUEYA_PROD_BASE_URL: https://srv1548487.hstgr.cloud
          REMOTE_PUSH_CONFIGURED: "false"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testDevDebugUnitTest \
            :app:lintDevDebug \
            :app:lintProdRelease \
            :app:assembleDevDebug
