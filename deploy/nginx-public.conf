# موقع المتجر العام للرؤية العربية على VPS.
# هذا الملف ملتزم ومراجع مع موقع النظام الداخلي؛ لا تحتفظ بنسخة يدوية منفصلة في الخادم.
# لا تنسخه يدوياً ولا تسمح لـcertbot بإعادة كتابته. التثبيت/الإصلاح الوحيد:
#   sudo "$(command -v node)" scripts/install-nginx-contract.mjs
# الشهادة نفسها تُجدَّد عبر certbot renew؛ مساراتها الثابتة أدناه جزء من العقد.

server {
    listen 80;
    listen [::]:80;
    server_name alarabiya.online www.alarabiya.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alarabiya.online www.alarabiya.online;

    ssl_certificate /etc/letsencrypt/live/alarabiya.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alarabiya.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # نفس ملف السر الحيّ الذي يستعمله المضيف الداخلي وعملية Node.
    include snippets/alroya-proxy-secret.conf;

    client_max_body_size 25m;
    include snippets/alroya-cloudflare-realip.conf;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn alroya_conn 80;
    limit_req zone=alroya_general burst=120 nodelay;

    # سطح العملاء لا يمرر API النظام الداخلي إلى Node. القائمة تكرر عقد الحارس الخادمي
    # عمداً كدفاع أول عند الحافة؛ الدفعة لا تجتاز إلا إذا كانت كل أسمائها عامة صراحةً.
    location ^~ /api/img/ {
        proxy_pass http://127.0.0.1:3000;
        include snippets/alroya-proxy-common.conf;
    }
    location ~ "^/api/trpc/(?:(?:storefront|courier)\.[^/?]+|auth\.(?:nativeDeviceChallenge|me|tenancyMode|resetPasswordWithToken|login|twoFactorVerify|changePassword|revokeMySessions|mySessions|revokeSession|twoFactorStatus|twoFactorSetupStart|twoFactorSetupConfirm|twoFactorDisable|twoFactorRegenerateCodes)|push\.(?:publicKey|myStatus|subscribe|unsubscribe)|recruitment\.(?:submit|openVacancies))(?:,(?:(?:storefront|courier)\.[^/?]+|auth\.(?:nativeDeviceChallenge|me|tenancyMode|resetPasswordWithToken|login|twoFactorVerify|changePassword|revokeMySessions|mySessions|revokeSession|twoFactorStatus|twoFactorSetupStart|twoFactorSetupConfirm|twoFactorDisable|twoFactorRegenerateCodes)|push\.(?:publicKey|myStatus|subscribe|unsubscribe)|recruitment\.(?:submit|openVacancies)))*$" {
        proxy_pass http://127.0.0.1:3000;
        include snippets/alroya-proxy-common.conf;
    }
    location /api/ { return 404; }

    include snippets/alroya-app-locations.conf;
}
