# موقع المتجر العام للرؤية العربية على VPS.
# هذا الملف ملتزم ومراجع مع موقع النظام الداخلي؛ لا تحتفظ بنسخة يدوية منفصلة في الخادم.
# ثبّت المقتطفات المشتركة كما هو موضح في deploy/nginx-erp.conf أولاً.
#
#   cp deploy/nginx-public.conf /etc/nginx/sites-available/alroya-public
#   chown root:root /etc/nginx/sites-available/alroya-public && chmod 644 /etc/nginx/sites-available/alroya-public
#   ln -s /etc/nginx/sites-available/alroya-public /etc/nginx/sites-enabled/alroya-public
#   nginx -t && systemctl reload nginx
#   certbot --nginx --hsts -d alarabiya.online -d www.alarabiya.online

server {
    listen 80;
    listen [::]:80;
    server_name alarabiya.online www.alarabiya.online;

    # نفس ملف السر الحيّ الذي يستعمله المضيف الداخلي وعملية Node.
    include snippets/alroya-proxy-secret.conf;

    client_max_body_size 25m;
    include snippets/alroya-cloudflare-realip.conf;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn alroya_conn 80;
    limit_req zone=alroya_general burst=120 nodelay;

    include snippets/alroya-app-locations.conf;
}
