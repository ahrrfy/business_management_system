# واجهة React المشتركة بين مضيف النظام ومضيف المتجر العام.
# تبقى منفصلة عن مواقع API حتى يستطيع المضيف العام حصر API بقائمة سماح
# دون إعادة استيراد location /api/ العام الخاص بمضيف النظام الداخلي.

location / {
    proxy_pass $alroya_backend;
    include snippets/alroya-proxy-common.conf;
    # لا WebSocket في الإنتاج (لا HMR)؛ tRPC والطباعة عبر HTTP عادي.
}
