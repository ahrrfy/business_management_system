# Type=forking removes a stale PIDFile immediately before ExecStart. The +
# prefix runs only the installed root-owned helper with full privileges. It
# drops PM2 resurrect to deploy, then creates a trusted root-owned PIDFile in
# /run so systemd may safely adopt an existing daemon outside this cgroup.
[Service]
PIDFile=/run/erp-pm2/pm2-deploy.pid
UnsetEnvironment=NODE_OPTIONS NODE_PATH
Environment=PATH=/opt/alroya-erp/node-v24.22.1-linux-x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
ExecStart=
ExecStart=+/opt/alroya-erp/node-v24.22.1-linux-x64/bin/node /usr/local/libexec/erp/pm2-systemd-start.mjs
