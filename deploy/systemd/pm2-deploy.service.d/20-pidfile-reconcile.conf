# Type=forking removes a stale PIDFile immediately before ExecStart. When a PM2
# daemon already exists, `pm2 resurrect` connects to it and does not recreate
# pm2.pid, so systemd reports protocol failure while the applications stay up.
# The wrapper preserves PM2's normal clean-boot behaviour, then verifies the
# unique existing/new daemon and recreates the PID file without a restart.
[Service]
ExecStart=
ExecStart=/usr/bin/node /home/deploy/erp/scripts/pm2-systemd-start.mjs
