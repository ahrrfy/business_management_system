# موقع النظام الداخلي للرؤية العربية على VPS.
# الخادم مشترك: ثبّت ملف موقع جديداً، اختبر بـ nginx -t، ثم reload فقط.
#
# التثبيت المشترك للمضيفين (نفّذه قبل تفعيل أيّ vhost):
#   cp deploy/nginx-ratelimit.conf         /etc/nginx/conf.d/alroya-ratelimit-zones.conf
#   mkdir -p /etc/nginx/snippets
#   cp deploy/nginx-cloudflare-realip.conf /etc/nginx/snippets/alroya-cloudflare-realip.conf
#   cp deploy/nginx-proxy-common.conf       /etc/nginx/snippets/alroya-proxy-common.conf
#   cp deploy/nginx-app-locations.conf      /etc/nginx/snippets/alroya-app-locations.conf
#   install -o root -g root -m 600 /dev/null /etc/nginx/snippets/alroya-proxy-secret.conf
#   sudoedit /etc/nginx/snippets/alroya-proxy-secret.conf
#
# ملف السر الحيّ يحتوي توجيه set واحداً بالشكل الموثّق في nginx-proxy-secret.conf.example،
# وقيمته تطابق INTERNAL_PROXY_SECRET في .env. لا تنسخ المثال بقيمته الوهمية ولا تطبع السر.
#
#   cp deploy/nginx-erp.conf /etc/nginx/sites-available/alroya-erp
#   chown root:root /etc/nginx/sites-available/alroya-erp && chmod 644 /etc/nginx/sites-available/alroya-erp
#   ln -s /etc/nginx/sites-available/alroya-erp /etc/nginx/sites-enabled/alroya-erp
#   nginx -t && systemctl reload nginx
#   certbot --nginx --hsts -d srv1548487.hstgr.cloud

server {
    listen 80;
    listen [::]:80;
    server_name srv1548487.hstgr.cloud;

    # مصدر واحد للسر بين المضيف الداخلي والعام؛ يمنع اختلاف القيم عند التدوير.
    include snippets/alroya-proxy-secret.conf;

    client_max_body_size 25m;
    include snippets/alroya-cloudflare-realip.conf;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn alroya_conn 80;
    limit_req zone=alroya_general burst=120 nodelay;

    # نفس مجموعة locations للمضيفين. أي مسار جديد إلى Node يُضاف مرة واحدة هنا.
    include snippets/alroya-app-locations.conf;
}
