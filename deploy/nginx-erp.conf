# موقع النظام الداخلي للرؤية العربية على VPS.
# الخادم مشترك: لا تنسخ المواقع أو المقتطفات يدوياً. مُثبّت العقد الجذري يجهزها
# بجوار أهدافها، يحفظ نسخة قابلة للاستعادة، يبدلها، ينفذ nginx -t ثم reload
# وفحصاً خارجياً، ويعيدها كلها عند أي فشل:
#   sudo "$(command -v node)" scripts/install-nginx-contract.mjs
#
# ملف السر الحيّ يحتوي توجيه set واحداً بالشكل الموثّق في nginx-proxy-secret.conf.example،
# وقيمته تطابق INTERNAL_PROXY_SECRET في .env. لا تنسخ المثال بقيمته الوهمية ولا تطبع السر.
# التمهيد اليدوي الوحيد قبل sudoedit: install -o root -g root -m 600 /dev/null /etc/nginx/snippets/alroya-proxy-secret.conf
#
# الشهادات ومساراتها الثابتة أدناه يجب أن تكون موجودة قبل تشغيل المثبّت؛ التجديد
# عبر certbot renew ولا يُسمح بإعادة كتابة ملف الموقع الملتزم.

server {
    listen 80;
    listen [::]:80;
    server_name srv1548487.hstgr.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srv1548487.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/srv1548487.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1548487.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # مصدر واحد للسر بين المضيف الداخلي والعام؛ يمنع اختلاف القيم عند التدوير.
    include snippets/alroya-proxy-secret.conf;

    client_max_body_size 25m;
    include snippets/alroya-cloudflare-realip.conf;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn alroya_conn 80;
    limit_req zone=alroya_general burst=120 nodelay;

    # نفس مجموعة locations للمضيفين. أي مسار جديد إلى Node يُضاف مرة واحدة هنا.
    include snippets/alroya-app-locations.conf;
}
