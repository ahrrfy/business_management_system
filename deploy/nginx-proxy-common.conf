# عقد الوكيل المشترك. يُضمَّن داخل كل location يحتوي proxy_pass إلى تطبيق الرؤية.
# إبقاؤه مقتطفاً واحداً يمنع نسيان سرّ القفزة أو اختلاف Host/XFF بين المضيفين.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Internal-Proxy-Secret $alroya_proxy_secret;
proxy_set_header X-Alroya-Worker-Probe "";
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
