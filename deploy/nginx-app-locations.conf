# مجموعة locations الكاملة لمضيف النظام الداخلي.
# السياق: داخل server. كل proxy_pass يجب أن يتبعه include للمقتطف المشترك محلياً؛
# لا نعتمد وراثة proxy_set_header لأن إضافة ترويسة داخل location تلغي وراثة المجموعة كلها.

location = /healthz {
    access_log off;
    proxy_pass http://127.0.0.1:3000;
    include snippets/alroya-proxy-common.conf;
}

# رفع SQL للاستعادة: الاستثناء الوحيد من سقف 25m العام.
location ~ ^/api/backups/restore-upload/?$ {
    client_max_body_size 200m;
    limit_req zone=alroya_restore burst=2 nodelay;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
    include snippets/alroya-proxy-common.conf;
    proxy_read_timeout 5m;
    proxy_send_timeout 5m;
}

location ~ "^/api/trpc/(?:[^/?]+,)*(?:auth\.login|auth\.twoFactorVerify|platformAdmin\.login)(?:,|$)" {
    limit_req zone=alroya_auth burst=30 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include snippets/alroya-proxy-common.conf;
}

location ~ "^/api/trpc/(?:[^/?]+,)*auth\.resetPasswordWithToken(?:,|$)" {
    limit_req zone=alroya_password_recovery burst=3 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include snippets/alroya-proxy-common.conf;
}

location ~ "^/api/webhooks(?:/|$)" {
    limit_req zone=alroya_webhooks burst=60 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include snippets/alroya-proxy-common.conf;
}

location /api/ {
    limit_req zone=alroya_api burst=60 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include snippets/alroya-proxy-common.conf;
}

include snippets/alroya-spa-location.conf;
