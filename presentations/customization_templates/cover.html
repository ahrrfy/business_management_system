<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0} .slide-container{width:1280px;min-height:720px;background:linear-gradient(135deg,#2B2D42 0%,#273E5E 58%,#457B9D 100%);font-family:Cairo,Arial,sans-serif;color:#F8F9FA;display:grid;grid-template-columns:1.08fr .92fr;direction:rtl} .intro{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:88px 92px} .eyebrow{font-size:17px;letter-spacing:1px;color:#B8D5E6;margin-bottom:24px}.intro h1{font-size:62px;line-height:1.18;font-weight:800;max-width:610px}.intro p{font-size:25px;font-weight:300;line-height:1.7;color:#E5EDF2;margin-top:24px;max-width:560px}.meta{font-size:15px;color:#B8D5E6;margin-top:66px}.visual{display:flex;justify-content:center;align-items:center;padding:80px 64px}.flow{width:380px;display:flex;flex-direction:column;gap:18px}.node{border:1px solid rgba(248,249,250,.27);background:rgba(248,249,250,.09);border-radius:8px;padding:24px 28px;display:flex;align-items:center;gap:18px;font-size:20px;font-weight:700}.node i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F8F9FA;color:#2B2D42;font-size:20px}.connector{height:30px;width:2px;background:#8D99AE;margin:auto}.accent{color:#B8D5E6}.footline{height:4px;width:138px;background:#B8D5E6;border-radius:4px;margin-top:42px}
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="intro">
      <div class="eyebrow">تحديث Storefront والإدارة</div>
      <h1>قوالب التخصيص المنظمة</h1>
      <p>من قاعدة البيانات إلى تجربة شراء مرنة ودقيقة للمنتجات المطبوعة والهدايا.</p>
      <div class="footline"></div>
      <div class="meta">مكتبة العربية · بنية قابلة للإدارة والتوسع</div>
    </section>
    <section class="visual" aria-label="مسار مبسط للتخصيص">
      <div class="flow">
        <div class="node"><i class="fa-solid fa-sliders"></i><span>قالب المنتج</span></div>
        <div class="connector"></div>
        <div class="node"><i class="fa-solid fa-cart-shopping"></i><span>اختيار الزبون</span></div>
        <div class="connector"></div>
        <div class="node"><i class="fa-solid fa-receipt"></i><span>طلب قابل للتنفيذ</span></div>
      </div>
    </section>
  </div>
</body>
</html>
